{% extends "base.html" %}
{% block title %}超级管理员{% endblock %}
{% block content %}
<h1>超级管理员控制台</h1>
<div class="nav-pills mt-16">
  <a href="{{ url_for('admin.users') }}">账号管理</a>
  <a href="{{ url_for('admin.courses') }}">课程管理</a>
  <a href="{{ url_for('admin.classes') }}">班级管理</a>
  <a href="{{ url_for('admin.invite_codes') }}">邀请码管理</a>
  <a href="{{ url_for('admin.assignments') }}">作业总览</a>
  <a href="{{ url_for('admin.audit') }}">操作日志</a>
  <a href="{{ url_for('admin.export_grades') }}">导出成绩</a>
</div>
<div class="grid-4 mt-16">
  <div class="card stat-card">
    <div class="stat-num">{{ counts.users }}</div>
    <div class="stat-label">系统用户</div>
  </div>
  <div class="card stat-card">
    <div class="stat-num">{{ counts.courses }}</div>
    <div class="stat-label">课程</div>
  </div>
  <div class="card stat-card">
    <div class="stat-num">{{ counts.classes }}</div>
    <div class="stat-label">班级</div>
  </div>
  <div class="card stat-card">
    <div class="stat-num">{{ counts.assignments }}</div>
    <div class="stat-label">作业</div>
  </div>
</div>
{% endblock %}
