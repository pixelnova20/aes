{% extends "base.html" %}
{% block title %}可批改作业{% endblock %}
{% block content %}
<div class="card-header">
  <h2>可批改作业</h2>
  <a href="{{ url_for('ta.dashboard') }}" class="btn btn-sm btn-secondary">返回</a>
</div>
<div class="card">
  <table class="table">
    <thead><tr><th>标题</th><th>课程</th><th>章节</th><th>发布教师</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>
      {% for a in assignments %}
      <tr>
        <td>{{ a.title }}</td>
        <td>{{ a.course.name }}</td>
        <td>第{{ a.chapter.chapter_number }}章</td>
        <td>{{ a.publisher.name }}</td>
        <td><span class="badge badge-{{ a.status }}">{{ a.status_label }}</span></td>
        <td><a href="{{ url_for('ta.assignment_detail', assignment_id=a.id) }}" class="btn btn-sm btn-primary">查看</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
